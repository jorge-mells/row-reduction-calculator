<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Row Reduction Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family: Inter, system-ui, sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e7ef;
      padding: 26px 32px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #667085;
    }

    main {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 20px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 24px;
    }

    .card {
      background: white;
      border: 1px solid #e2e7ef;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(20, 30, 50, 0.05);
    }

    /* ---------------------------------------------------------
       Toolbar
    --------------------------------------------------------- */

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      border: 1px solid #d5dbe6;
      background: white;
      border-radius: 8px;
      padding: 9px 13px;
      font: inherit;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #f4f6fa;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    button.primary {
      background: #172033;
      color: white;
      border-color: #172033;
    }

    button.undo {
      display: flex;
      align-items: center;
      gap: 6px;

      font-weight: 600;

      background: #fff;
      border-color: #bfc7d6;
    }

    button.undo:not(:disabled):hover {
      background: #f0f2f7;
    }

    button.danger {
      color: #b42318;
    }

    .separator {
      width: 1px;
      height: 28px;
      background: #e2e7ef;
      margin: 0 4px;
    }

    /* ---------------------------------------------------------
       Matrix
    --------------------------------------------------------- */

    .matrix {
      display: flex;
      flex-direction: column;
      gap: 8px;

      overflow-x: auto;
      padding: 10px 2px;
    }

    .matrix-row {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 7px 8px;

      border-radius: 10px;
      border: 1px solid transparent;

      background: #fafbfe;

      transition:
        background 120ms ease,
        border-color 120ms ease,
        opacity 120ms ease;
    }

    .matrix-row.dragging {
      opacity: 0.4;
    }

    .matrix-row.drag-target {
      background: #f1edff;
      border-color: #8066e8;
    }

    .drag-handle {
      width: 28px;

      color: #98a2b3;

      cursor: grab;
      user-select: none;

      font-size: 18px;
      text-align: center;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .row-label {
      width: 30px;

      color: #667085;
      font-weight: 700;

      user-select: none;
    }

    .cells {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cell {
      width: 68px;
      height: 38px;

      border: 1px solid #ccd3df;
      border-radius: 7px;

      padding: 5px 8px;

      background: white;

      text-align: right;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: 16px;
    }

    .cell:focus {
      outline: 2px solid #8066e8;
      border-color: transparent;
    }

    .augmented-bar {
      height: 30px;

      border-left: 2px solid #667085;

      margin: 0 5px;
    }

    .hint {
      margin-top: 14px;

      color: #667085;

      font-size: 13px;
    }

    /* ---------------------------------------------------------
       History
    --------------------------------------------------------- */

    .history-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 16px;
    }

    .history-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 12px;

      max-height: calc(100vh - 180px);
      overflow-y: auto;

      padding-right: 3px;
    }

    .step {
      border: 1px solid #e2e7ef;
      border-radius: 10px;

      overflow: hidden;

      background: #fff;

      cursor: pointer;

      transition:
        border-color 120ms ease,
        box-shadow 120ms ease;
    }

    .step:hover {
      border-color: #b8c0d0;
      box-shadow: 0 3px 10px rgba(20, 30, 50, 0.06);
    }

    .step.current {
      border-color: #8066e8;
      box-shadow: 0 0 0 2px #8066e820;
    }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 9px 11px;

      background: #f7f8fb;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: 12px;
    }

    .step-number {
      color: #667085;
    }

    .step-operation {
      padding: 9px 11px 3px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: 13px;
      font-weight: 600;
    }

    .mini-matrix {
      padding: 8px 11px 11px;

      overflow-x: auto;
    }

    .mini-row {
      display: flex;
      gap: 5px;

      margin-bottom: 4px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: 12px;
    }

    .mini-cell {
      min-width: 32px;
      text-align: right;
    }

    .mini-bar {
      border-left: 1px solid #667085;
      margin: 0 2px;
    }

    .initial-step {
      padding: 11px;
    }

    .initial-step .step-operation {
      padding: 0 0 8px;
    }

    .empty-history {
      color: #98a2b3;
      font-size: 14px;
    }

    .restore-note {
      padding: 7px 11px 10px;

      color: #98a2b3;
      font-size: 11px;
    }

    /* ---------------------------------------------------------
       Operation dialog
    --------------------------------------------------------- */

    .overlay {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(23, 32, 51, 0.35);
    }

    .dialog {
      width: min(430px, 100%);

      background: white;
      border-radius: 14px;

      padding: 22px;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .dialog h2 {
      margin: 0 0 8px;

      font-size: 19px;
    }

    .operation-preview {
      margin: 16px 0;

      padding: 13px;

      border-radius: 9px;

      background: #f7f4ff;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: 16px;
    }

    .coefficient {
      width: 120px;

      padding: 9px;

      border: 1px solid #ccd3df;
      border-radius: 8px;

      font:
        16px ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
    }

    .dialog-actions {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 20px;
    }

    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
      }

      .step-list {
        max-height: none;
      }
    }
  </style>
</head>


<body>

<header>

  <h1>Row Reduction Calculator</h1>

  <p>
    Drag one row onto another to perform an elementary row operation.
  </p>

</header>


<main>

  <!-- ========================================================
       Main matrix
  ========================================================= -->

  <section class="card">

    <div class="toolbar">

      <!-- Most important new control -->

      <button
        id="undo"
        class="undo"
        disabled
        title="Undo last operation (Ctrl+Z)"
      >
        ↶ Undo
      </button>


      <div class="separator"></div>


      <button id="add-row">
        + Row
      </button>

      <button id="remove-row">
        − Row
      </button>

      <button id="add-column">
        + Column
      </button>

      <button id="remove-column">
        − Column
      </button>


      <div class="separator"></div>


      <button id="reset" class="danger">
        Reset
      </button>

    </div>


    <div id="matrix" class="matrix"></div>


    <div class="hint">

      Grab the <strong>⠿</strong> handle and drag a row onto another row.

      <br />

      <strong>Ctrl+Z</strong> / <strong>⌘Z</strong> also undoes the last operation.

    </div>

  </section>


  <!-- ========================================================
       History
  ========================================================= -->

  <aside class="card">

    <div class="history-title">

      <h2>
        Operation history
      </h2>

    </div>


    <div
      id="history"
      class="step-list"
    >

    </div>

  </aside>

</main>


<!-- ==========================================================
     Operation dialog
=========================================================== -->

<div
  id="overlay"
  class="overlay"
>

  <div class="dialog">

    <h2>
      Modify row
    </h2>


    <div
      id="operation-preview"
      class="operation-preview"
    ></div>


    <label>

      Multiplier

      <br />

      <input
        id="coefficient"
        class="coefficient"
        value="-1"
        autocomplete="off"
      />

    </label>


    <div class="dialog-actions">

      <button id="cancel">
        Cancel
      </button>

      <button
        id="apply"
        class="primary"
      >
        Apply
      </button>

    </div>

  </div>

</div>


<script>

//
// ============================================================
// Matrix state
// ============================================================
//

const initialMatrix = [
  ["1", "2", "3", "4"],
  ["2", "5", "7", "9"],
  ["1", "1", "2", "3"]
];


//
// The current matrix.
//

let matrix =
  initialMatrix.map(row => [...row]);


//
// Every operation stores:
//
// {
//   operation: "...",
//   matrix: [...]
//
// }
//
// This means history isn't merely a list of strings.
// It is a complete timeline of the calculation.
//

let history = [];


//
// Pending drag operation.
//

let pendingOperation = null;


const matrixElement =
  document.getElementById("matrix");

const historyElement =
  document.getElementById("history");

const overlay =
  document.getElementById("overlay");

const operationPreview =
  document.getElementById("operation-preview");

const coefficientInput =
  document.getElementById("coefficient");

const undoButton =
  document.getElementById("undo");


//
// ============================================================
// Utility
// ============================================================
//

function cloneMatrix(source) {

  return source.map(
    row => [...row]
  );

}


//
// ============================================================
// Render current matrix
// ============================================================
//

function renderMatrix() {

  matrixElement.innerHTML = "";


  matrix.forEach(
    (row, rowIndex) => {

      const rowElement =
        document.createElement("div");

      rowElement.className =
        "matrix-row";

      rowElement.dataset.row =
        rowIndex;


      //
      // Drag handle
      //

      const handle =
        document.createElement("span");

      handle.className =
        "drag-handle";

      handle.textContent =
        "⠿";

      handle.title =
        "Drag row";

      rowElement.appendChild(
        handle
      );


      //
      // Row label
      //

      const label =
        document.createElement("span");

      label.className =
        "row-label";

      label.textContent =
        `R${rowIndex + 1}`;

      rowElement.appendChild(
        label
      );


      //
      // Cells
      //

      const cells =
        document.createElement("div");

      cells.className =
        "cells";


      row.forEach(
        (value, columnIndex) => {

          //
          // Augmented matrix separator.
          //
          // For now the final column is treated
          // as the augmented column.
          //

          if (
            columnIndex ===
            row.length - 1
          ) {

            const separator =
              document.createElement("span");

            separator.className =
              "augmented-bar";

            cells.appendChild(
              separator
            );

          }


          const input =
            document.createElement("input");

          input.className =
            "cell";

          input.value =
            value;

          input.dataset.row =
            rowIndex;

          input.dataset.column =
            columnIndex;


          //
          // Direct matrix editing.
          //

          input.addEventListener(
            "change",
            event => {

              matrix[rowIndex][columnIndex] =
                event.target.value.trim() ||
                "0";

              //
              // Editing the current matrix isn't
              // itself a row operation, so don't
              // put it into the operation history.
              //

              updateUndoButton();

            }
          );


          cells.appendChild(
            input
          );

        }
      );


      rowElement.appendChild(
        cells
      );


      //
      // ======================================================
      // Drag and drop
      // ======================================================
      //

      rowElement.draggable = true;


      rowElement.addEventListener(
        "dragstart",
        event => {

          event.dataTransfer.effectAllowed =
            "move";

          event.dataTransfer.setData(
            "text/plain",
            String(rowIndex)
          );

          rowElement.classList.add(
            "dragging"
          );

        }
      );


      rowElement.addEventListener(
        "dragend",
        () => {

          rowElement.classList.remove(
            "dragging"
          );

        }
      );


      rowElement.addEventListener(
        "dragover",
        event => {

          const source =
            Number(
              event.dataTransfer.getData(
                "text/plain"
              )
            );


          //
          // Can't operate on a row using
          // itself as the source.
          //

          if (
            source === rowIndex
          ) {
            return;
          }


          event.preventDefault();


          rowElement.classList.add(
            "drag-target"
          );

        }
      );


      rowElement.addEventListener(
        "dragleave",
        () => {

          rowElement.classList.remove(
            "drag-target"
          );

        }
      );


      rowElement.addEventListener(
        "drop",
        event => {

          event.preventDefault();


          rowElement.classList.remove(
            "drag-target"
          );


          const source =
            Number(
              event.dataTransfer.getData(
                "text/plain"
              )
            );


          if (
            !Number.isInteger(source) ||
            source === rowIndex
          ) {

            return;

          }


          openOperation(
            source,
            rowIndex
          );

        }
      );


      matrixElement.appendChild(
        rowElement
      );

    }
  );

}


//
// ============================================================
// Number parsing
// ============================================================
//

function parseNumber(value) {

  value =
    String(value).trim();


  //
  // Fractions such as:
  //
  // 1/2
  // -3/4
  //

  if (
    value.includes("/")
  ) {

    const parts =
      value.split("/");


    if (
      parts.length !== 2
    ) {

      return null;

    }


    const numerator =
      Number(parts[0]);

    const denominator =
      Number(parts[1]);


    if (
      !Number.isFinite(numerator) ||
      !Number.isFinite(denominator) ||
      denominator === 0
    ) {

      return null;

    }


    return numerator / denominator;

  }


  const number =
    Number(value);


  return Number.isFinite(number)
    ? number
    : null;

}


//
// ============================================================
// Number formatting
// ============================================================
//

function formatNumber(number) {

  if (
    Math.abs(number) < 1e-10
  ) {

    return "0";

  }


  if (
    Number.isInteger(number)
  ) {

    return String(number);

  }


  //
  // Look for a reasonably small
  // exact fraction.
  //

  for (
    let denominator = 2;
    denominator <= 1000;
    denominator++
  ) {

    const numerator =
      Math.round(
        number * denominator
      );


    if (
      Math.abs(
        number -
        numerator / denominator
      ) < 1e-10
    ) {

      return `${numerator}/${denominator}`;

    }

  }


  return Number(
    number.toFixed(8)
  ).toString();

}


//
// ============================================================
// Open operation dialog
// ============================================================
//

function openOperation(
  sourceRow,
  targetRow
) {

  pendingOperation = {
    sourceRow,
    targetRow
  };


  operationPreview.textContent =
    `R${targetRow + 1} ← R${targetRow + 1} + c·R${sourceRow + 1}`;


  coefficientInput.value =
    "-1";


  overlay.style.display =
    "flex";


  coefficientInput.focus();

  coefficientInput.select();

}


//
// ============================================================
// Apply operation
// ============================================================
//

function applyOperation() {

  if (
    !pendingOperation
  ) {

    return;

  }


  const coefficient =
    parseNumber(
      coefficientInput.value
    );


  if (
    coefficient === null
  ) {

    coefficientInput.focus();

    return;

  }


  const {
    sourceRow,
    targetRow
  } = pendingOperation;


  const source =
    matrix[sourceRow].map(
      parseNumber
    );

  const target =
    matrix[targetRow].map(
      parseNumber
    );


  //
  // Don't perform arithmetic on
  // invalid matrix entries.
  //

  if (
    source.some(
      value => value === null
    ) ||

    target.some(
      value => value === null
    )
  ) {

    alert(
      "Every matrix entry must be a number before applying an operation."
    );

    return;

  }


  //
  // The actual elementary row operation:
  //
  // R_target <- R_target + c R_source
  //

  matrix[targetRow] =
    target.map(
      (value, index) => {

        return formatNumber(
          value +
          coefficient *
          source[index]
        );

      }
    );


  //
  // Human-readable operation.
  //

  const sign =
    coefficient >= 0
      ? "+"
      : "−";


  const absoluteCoefficient =
    formatNumber(
      Math.abs(coefficient)
    );


  const operation =
    `R${targetRow + 1} ← R${targetRow + 1} ${sign} ${absoluteCoefficient}R${sourceRow + 1}`;


  //
  // IMPORTANT:
  //
  // Save the complete resulting matrix.
  //
  // This is what lets us later restore the
  // calculation to any previous point.
  //

  history.push({
    operation,

    matrix:
      cloneMatrix(matrix)
  });


  pendingOperation =
    null;


  overlay.style.display =
    "none";


  renderMatrix();

  renderHistory();

  updateUndoButton();

}


//
// ============================================================
// Undo
// ============================================================
//

function undo() {

  if (
    history.length === 0
  ) {

    return;

  }


  //
  // Remove the latest operation.
  //

  history.pop();


  //
  // Restore the matrix from the
  // previous history entry.
  //
  // If there isn't one, restore
  // the original matrix.
  //

  if (
    history.length === 0
  ) {

    matrix =
      cloneMatrix(
        initialMatrix
      );

  } else {

    matrix =
      cloneMatrix(
        history[
          history.length - 1
        ].matrix
      );

  }


  renderMatrix();

  renderHistory();

  updateUndoButton();

}


//
// ============================================================
// Undo button state
// ============================================================
//

function updateUndoButton() {

  undoButton.disabled =
    history.length === 0;

}


//
// ============================================================
// History rendering
// ============================================================
//

function renderHistory() {

  historyElement.innerHTML = "";


  //
  // Initial state
  //

  const initialStep =
    document.createElement("div");

  initialStep.className =
    "step initial-step";


  const initialHeader =
    document.createElement("div");

  initialHeader.className =
    "step-header";


  initialHeader.innerHTML =
    `<span class="step-number">Start</span>`;


  initialStep.appendChild(
    initialHeader
  );


  const initialOperation =
    document.createElement("div");

  initialOperation.className =
    "step-operation";

  initialOperation.textContent =
    "Initial matrix";

  initialStep.appendChild(
    initialOperation
  );


  const initialMatrixView =
    createMiniMatrix(
      initialMatrix
    );

  initialStep.appendChild(
    initialMatrixView
  );


  //
  // Clicking Start restores the
  // calculation completely.
  //

  initialStep.addEventListener(
    "click",
    () => {

      if (
        history.length === 0
      ) {

        return;

      }


      if (
        !confirm(
          "Restore the calculation to the initial matrix? Later operations will be removed."
        )
      ) {

        return;

      }


      history = [];

      matrix =
        cloneMatrix(
          initialMatrix
        );


      renderMatrix();

      renderHistory();

      updateUndoButton();

    }
  );


  historyElement.appendChild(
    initialStep
  );


  //
  // Every operation.
  //

  history.forEach(
    (entry, index) => {

      const step =
        document.createElement("div");

      step.className =
        "step";


      //
      // Last entry is the current state.
      //

      if (
        index === history.length - 1
      ) {

        step.classList.add(
          "current"
        );

      }


      const header =
        document.createElement("div");

      header.className =
        "step-header";


      header.innerHTML = `
        <span class="step-number">
          Step ${index + 1}
        </span>

        <span>
          ${index === history.length - 1
            ? "Current"
            : ""}
        </span>
      `;


      step.appendChild(
        header
      );


      const operation =
        document.createElement("div");

      operation.className =
        "step-operation";

      operation.textContent =
        entry.operation;


      step.appendChild(
        operation
      );


      const miniMatrix =
        createMiniMatrix(
          entry.matrix
        );


      step.appendChild(
        miniMatrix
      );


      //
      // If this is not the current step,
      // tell the user that clicking it
      // restores that point.
      //

      if (
        index <
        history.length - 1
      ) {

        const note =
          document.createElement("div");

        note.className =
          "restore-note";

        note.textContent =
          "Click to restore this point";


        step.appendChild(
          note
        );

      }


      //
      // Restore this point in history.
      //

      step.addEventListener(
        "click",
        () => {

          if (
            index ===
            history.length - 1
          ) {

            return;

          }


          //
          // Keep operations through
          // this step and discard
          // everything after it.
          //

          history =
            history.slice(
              0,
              index + 1
            );


          matrix =
            cloneMatrix(
              history[index].matrix
            );


          renderMatrix();

          renderHistory();

          updateUndoButton();

        }
      );


      historyElement.appendChild(
        step
      );

    }
  );

}


//
// ============================================================
// Mini matrix used by the history
// ============================================================
//

function createMiniMatrix(
  source
) {

  const container =
    document.createElement("div");

  container.className =
    "mini-matrix";


  source.forEach(
    row => {

      const rowElement =
        document.createElement("div");

      rowElement.className =
        "mini-row";


      row.forEach(
        (value, index) => {

          if (
            index ===
            row.length - 1
          ) {

            const bar =
              document.createElement("span");

            bar.className =
              "mini-bar";

            rowElement.appendChild(
              bar
            );

          }


          const cell =
            document.createElement("span");

          cell.className =
            "mini-cell";

          cell.textContent =
            value;

          rowElement.appendChild(
            cell
          );

        }
      );


      container.appendChild(
        rowElement
      );

    }
  );


  return container;

}


//
// ============================================================
// Keyboard undo
// ============================================================
//

document.addEventListener(
  "keydown",
  event => {

    const modifier =
      event.ctrlKey ||
      event.metaKey;


    if (
      modifier &&
      event.key.toLowerCase() === "z"
    ) {

      //
      // Don't intercept undo while
      // editing a matrix cell or
      // coefficient.
      //

      const element =
        document.activeElement;


      const isInput =
        element &&
        (
          element.tagName === "INPUT" ||
          element.tagName === "TEXTAREA"
        );


      if (
        isInput
      ) {

        return;

      }


      event.preventDefault();

      undo();

    }

  }
);


// ============================================================
// Dialog controls
// ============================================================

document
  .getElementById("apply")
  .addEventListener(
    "click",
    applyOperation
  );


document
  .getElementById("cancel")
  .addEventListener(
    "click",
    () => {

      pendingOperation =
        null;

      overlay.style.display =
        "none";

    }
  );


coefficientInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      applyOperation();

    }


    if (
      event.key === "Escape"
    ) {

      pendingOperation =
        null;

      overlay.style.display =
        "none";

    }

  }
);


// ============================================================
// Matrix size controls
// ============================================================

document
  .getElementById("add-row")
  .addEventListener(
    "click",
    () => {

      matrix.push(
        Array(
          matrix[0].length
        ).fill("0")
      );

      renderMatrix();

    }
  );


document
  .getElementById("remove-row")
  .addEventListener(
    "click",
    () => {

      if (
        matrix.length <= 1
      ) {

        return;

      }

      matrix.pop();

      renderMatrix();

    }
  );


document
  .getElementById("add-column")
  .addEventListener(
    "click",
    () => {

      matrix.forEach(
        row => row.push("0")
      );

      renderMatrix();

    }
  );


document
  .getElementById("remove-column")
  .addEventListener(
    "click",
    () => {

      if (
        matrix[0].length <= 2
      ) {

        return;

      }

      matrix.forEach(
        row => row.pop()
      );

      renderMatrix();

    }
  );


document
  .getElementById("reset")
  .addEventListener(
    "click",
    () => {

      if (
        history.length > 0 &&
        !confirm(
          "Reset the entire calculation?"
        )
      ) {

        return;

      }


      matrix =
        cloneMatrix(
          initialMatrix
        );

      history = [];


      renderMatrix();

      renderHistory();

      updateUndoButton();

    }
  );


// ============================================================
// Initial render
// ============================================================

renderMatrix();

renderHistory();

updateUndoButton();

</script>

</body>
</html>
